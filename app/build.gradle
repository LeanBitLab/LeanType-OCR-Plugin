plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

import java.util.Properties

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'helium314.keyboard.ocr.plugin'
    compileSdk 34

    defaultConfig {
        applicationId "helium314.keyboard.ocr.plugin"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                outputFileName = "ocr_plugin-${abi}.apk"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    compileOnly 'androidx.work:work-runtime:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // ML Kit Text Recognition v2 bundled offline models
    implementation('com.google.mlkit:text-recognition:16.0.1') {
        exclude group: 'androidx.work', module: 'work-runtime'
    }
    implementation('com.google.mlkit:text-recognition-devanagari:16.0.1') {
        exclude group: 'androidx.work', module: 'work-runtime'
    }
    implementation('com.google.mlkit:text-recognition-chinese:16.0.1') {
        exclude group: 'androidx.work', module: 'work-runtime'
    }
    implementation('com.google.mlkit:text-recognition-japanese:16.0.1') {
        exclude group: 'androidx.work', module: 'work-runtime'
    }
    implementation('com.google.mlkit:text-recognition-korean:16.0.1') {
        exclude group: 'androidx.work', module: 'work-runtime'
    }
}
